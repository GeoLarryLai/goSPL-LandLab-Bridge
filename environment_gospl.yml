# Standalone goSPL env (latest geodels package).
#
# Recreate:
#   conda env remove -n gospl -y
#   conda env create -f environment_gospl.yml
#
# Official docs: https://gospl.readthedocs.io/en/latest/getting_started/installConda.html

name: gospl
channels:
  - geodels
  - conda-forge
dependencies:
  - python=3.11
  - gospl=2026.7.14
  - gflex>=1.1
  - matplotlib
  - pyyaml
  - jupyter
  - ipykernel
  - pip
