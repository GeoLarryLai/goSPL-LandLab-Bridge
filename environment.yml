# This bridge only. goSPL is not pinned here.
# Install goSPL from its own docs:
# https://gospl.readthedocs.io/en/latest/getting_started/installConda.html
#
#   conda env create -f environment.yml
#   conda activate gospl-landlab-bridge
#   pip install -e .

name: gospl-landlab-bridge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - jupyter
  - ipykernel
  - pip
  - pip:
      - numpy
      - scipy
      - landlab>=2.6
      - joblib
      - imageio>=2.31
      - imageio-ffmpeg
      - h5py
      - pandas
      - matplotlib
      - tqdm
      - pyyaml
      - threadpoolctl
      - pillow
