name: compare-runA-gospl-spl

domain:
    npdata: ['examples/inputs/compare_flat', 'v', 'c', 'z']
    flowdir: 1
    seadepo: True
    bc: '0000'

time:
    start: 0.
    end: 4.e6
    dt: 5.e4
    tout: 5.e4
    strat: 5.e4

spl:
    K: 5.e-6
    d: 0.
    m: 0.5
    G: 1.

diffusion:
    hillslopeKa: 0.5
    hillslopeKm: 50.0
    # clinSlp>0 builds a VTK mesh (broken vtk on some Macs); keep 0 for the bridge demo
    clinSlp: 0.0

climate:
  - start: 0.
    uniform: 1.0

tectonics:
  - start: 0.
    end: 4.e6
    upsub: ['examples/inputs/compare_flat_tect', 'z']

sea:
    position: 0.

# No live flexure: basin accommodation is the imposed exponential subsidence
# in examples/inputs/compare_flat_tect.npz (see mesh_builder).

compaction:
    phis: 0.49
    z0s: 3700.0

output:
    dir: 'examples/outputs/runA_gospl_spl'
    makedir: False
